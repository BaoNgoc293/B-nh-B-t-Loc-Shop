<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiệm Bánh Bột Lọc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f8f4; --surface: #ffffff; --fg: #17261f; --muted: #587064; --line: #d3e1d8;
  --leaf: #1f5a40; --leaf-ink: #ffffff; --leaf-soft: #e1efe6; --shrimp: #d9583a; --shrimp-soft: #fbe6df;
  --font-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1913; --surface: #162620; --fg: #e5f0e9; --muted: #92a89b; --line: #27392f;
    --leaf: #6ccb9a; --leaf-ink: #0a1a11; --leaf-soft: #1c3328; --shrimp: #f08b6f; --shrimp-soft: #3a211b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 46ch; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--shrimp); outline-offset: 2px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.menu { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item h2 { font-family: var(--font-display); font-size: 18px; margin: 0; font-weight: 600; }
.item p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--shrimp); margin-top: 4px; font-size: 14px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 20px; line-height: 1; cursor: pointer; }
.step button:hover { border-color: var(--leaf); }
.step input { width: 46px; text-align: center; font: inherit; font-variant-numeric: tabular-nums; font-weight: 600; border: 0; background: transparent; color: var(--fg); -moz-appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
@media (min-width: 761px) { .card.sticky { position: sticky; top: 16px; } }
.card h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); }
input[type="text"], input[type="tel"], textarea { font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
textarea { resize: vertical; min-height: 64px; }
.lines { display: grid; gap: 4px; font-size: 14px; }
.line { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.line span:first-child { min-width: 0; overflow-wrap: anywhere; }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.total strong { font-family: var(--font-display); font-size: 24px; color: var(--shrimp); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.btn { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--leaf); color: var(--leaf-ink); cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--leaf); border: 1px solid var(--leaf); }
.msg { margin: 0; font-size: 13.5px; padding: 10px 12px; border-radius: 8px; background: var(--leaf-soft); }
.msg.warn { background: var(--shrimp-soft); }
.err { color: var(--shrimp); font-size: 13px; margin: 0; }
.err[hidden], #result[hidden] { display: none; }
pre.copy { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 var(--font-body); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
@media (prefers-reduced-motion: no-preference) { .btn, .step button { transition: background 0.15s, border-color 0.15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tiệm Bánh Bột Lọc</h1>
    <p class="sub">Bánh làm trong ngày, hấp nóng. Chọn số phần, điền thông tin và gửi đơn.</p>
  </header>
  <main class="cols">
    <section class="menu" id="menu" aria-label="Thực đơn"></section>
    <form class="card sticky" id="form" autocomplete="on">
      <h2>Phiếu đặt hàng</h2>
      <div class="lines" id="lines"></div>
      <div class="total"><span>Tổng cộng</span><strong id="total">0đ</strong></div>
      <label for="f-name">Tên của bạn
        <input type="text" id="f-name" name="name" required maxlength="80" autocomplete="name">
      </label>
      <label for="f-phone">Số điện thoại
        <input type="tel" id="f-phone" name="phone" required inputmode="tel" maxlength="16" autocomplete="tel">
      </label>
      <label for="f-note">Địa chỉ giao hoặc giờ đến lấy
        <textarea id="f-note" name="note" maxlength="300" placeholder="Ví dụ: giao 11h30 đến 12 Nguyễn Huệ, hoặc tự đến lấy lúc 17h"></textarea>
      </label>
      <div class="hp" aria-hidden="true"><label>Website <input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="err" id="err" hidden></p>
      <button class="btn" type="submit" id="submit">Gửi đơn</button>
      <div id="result" hidden></div>
    </form>
  </main>
</div>

<script>
/* ===== PHẦN CẦN SỬA ===== */

/* Dán địa chỉ Web app của Google Apps Script vào đây (xem HUONG-DAN.md).
   Để trống thì trang chỉ tạo nội dung đơn để khách sao chép gửi qua Zalo. */
const ORDER_URL = "https://script.google.com/macros/s/AKfycby6gcytxqCDHelgocZVA-32aa5RH-Ucb4DS2K_-Xf3yvmzH6_QpbSMAg_FecSo9MawoBg/exec";

/* Thực đơn. Tên món và giá phải giống hệt MENU trong Code.gs. Giá tính bằng đồng. */
const MENU = [
  { id: "tran", name: "Bánh bột lọc trần",   desc: "Nhân tôm thịt, kèm chén nước mắm ớt pha sẵn",       unit: "phần 10 cái", price: 35000 },
  { id: "goi",  name: "Bánh bột lọc gói lá", desc: "Hấp trong lá chuối, thơm mùi lá, nhân tôm thịt",    unit: "phần 10 cái", price: 40000 },
  { id: "nuoc", name: "Nước mắm ớt thêm",    desc: "Chén nước mắm ớt tỏi pha riêng",                    unit: "chén",        price: 5000 }
];

/* ===== HẾT PHẦN CẦN SỬA ===== */

const qty = {};
MENU.forEach(m => qty[m.id] = 0);
const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat("vi-VN").format(n) + "đ";
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  });
  kids.flat().forEach(k => el.append(k instanceof Node ? k : document.createTextNode(k)));
  return el;
}
function setQty(id, n) {
  qty[id] = Math.max(0, Math.min(99, n | 0));
  const input = $("q-" + id);
  if (input) input.value = qty[id];
  renderSummary();
}
function renderMenu() {
  $("menu").replaceChildren(...MENU.map(m => h("div", { class: "item" },
    h("div", {}, h("h2", {}, m.name), h("p", {}, m.desc), h("div", { class: "price" }, money(m.price) + " / " + m.unit)),
    h("div", { class: "step" },
      h("button", { type: "button", "aria-label": "Bớt " + m.name, onclick: () => setQty(m.id, qty[m.id] - 1) }, "−"),
      h("input", { id: "q-" + m.id, type: "number", min: "0", max: "99", value: qty[m.id], "aria-label": "Số lượng " + m.name,
        onchange: e => setQty(m.id, parseInt(e.target.value, 10) || 0) }),
      h("button", { type: "button", "aria-label": "Thêm " + m.name, onclick: () => setQty(m.id, qty[m.id] + 1) }, "+"))
  )));
}
const chosen = () => MENU.filter(m => qty[m.id] > 0).map(m => ({ id: m.id, name: m.name, unit: m.unit, qty: qty[m.id], price: m.price }));
const totalOf = items => items.reduce((s, i) => s + i.qty * i.price, 0);
function renderSummary() {
  const items = chosen();
  $("lines").replaceChildren(...(items.length
    ? items.map(i => h("div", { class: "line" }, h("span", {}, i.qty + " × " + i.name), h("span", {}, money(i.qty * i.price))))
    : [h("p", { class: "empty" }, "Chưa chọn món nào. Bấm dấu + ở thực đơn.")]));
  $("total").textContent = money(totalOf(items));
}
function orderText(o) {
  return ["ĐƠN BÁNH BỘT LỌC", "Tên: " + o.name, "SĐT: " + o.phone, "Giao/lấy: " + (o.note || "chưa ghi"),
    ...o.items.map(i => "- " + i.name + " x" + i.qty + " (" + i.unit + ") = " + money(i.qty * i.price)),
    "Tổng: " + money(o.total)].join("\n");
}
async function copyText(text, pre, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Đã sao chép"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(pre);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = "Đã bôi đen, bấm Ctrl+C để sao chép";
  }
}
function showResult(kind, message, order) {
  const result = $("result");
  const nodes = [h("p", { class: kind === "ok" ? "msg" : "msg warn" }, message)];
  if (kind !== "ok") {
    const text = orderText(order);
    const pre = h("pre", { class: "copy" }, text);
    const btn = h("button", { type: "button", class: "btn ghost", onclick: () => copyText(text, pre, btn) }, "Sao chép nội dung đơn");
    nodes.push(pre, btn);
  }
  result.replaceChildren(...nodes);
  result.hidden = false;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("err"), btn = $("submit");
  err.hidden = true;
  const items = chosen();
  if (!items.length) { err.textContent = "Bạn chưa chọn món nào."; err.hidden = false; return; }
  const order = {
    name: $("f-name").value.trim(), phone: $("f-phone").value.trim(), note: $("f-note").value.trim(),
    website: $("f-website").value, items, total: totalOf(items)
  };
  if (!ORDER_URL) {
    showResult("copy", "Hãy sao chép nội dung dưới đây và gửi cho tiệm qua Zalo hoặc tin nhắn.", order);
    return;
  }
  btn.disabled = true; btn.textContent = "Đang gửi...";
  try {
    /* text/plain để trình duyệt không cần bước kiểm tra CORS trước với Apps Script */
    const res = await fetch(ORDER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ name: order.name, phone: order.phone, note: order.note, website: order.website,
        items: items.map(i => ({ id: i.id, qty: i.qty })) })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Lỗi không rõ");
    showResult("ok", "Đã nhận đơn" + (data.id ? " " + data.id : "") + ". Tiệm sẽ gọi xác nhận qua số điện thoại bạn đã nhập.", order);
    MENU.forEach(m => qty[m.id] = 0);
    renderMenu(); renderSummary();
    $("f-note").value = "";
  } catch (x) {
    showResult("copy", "Chưa chắc đơn đã được gửi (" + (x.message || "lỗi mạng") + "). Để chắc ăn, hãy sao chép nội dung dưới đây và gửi cho tiệm qua Zalo.", order);
  } finally {
    btn.disabled = false; btn.textContent = "Gửi đơn";
  }
});

renderMenu();
renderSummary();
</script>
</body>
</html>
